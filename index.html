<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>MAZZEL Best Visual 9 - Performance Costume</title>
  <meta name="description" content="好きなパフォーマンス衣装を選んでベストビジュを作れます">
  <meta property="og:title" content="MAZZEL Best Visual 9 - Performance Costume">
  <meta property="og:description" content="好きなパフォーマンス衣装を選んでベストビジュを作れます">
  <meta property="og:image" content="https://rikomuze.github.io/mazzel-best-visual-performance/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
  /* =====================================================================
     最強9マス — MUZE TOOL BOX「作業机」ブランド版
     机の上の“ベタ焼き(コンタクトシート)”。炭色のシートに9コマが並び、
     コマを直接タップして差し替える。編集画面=保存される画像。
     6選(白フチのプリント/いちご)との兄弟だが、こちらは炭色/ミント担当。
     ===================================================================== */
  :root{
    --desk:#f1ebe1;
    --paper:#ffffff;
    --pencil:#40382f;
    --faded:#8f8577;
        --sheet:#F4E8E2;            /* ピンクベージュのコンタクトシート */
        --sheet-ink:#40382f;
        --sheet-soft:rgba(64,56,47,.58);
        --mint:#D8A6A8;             /* ピンクベージュ用アクセント */
        --mint-bright:#D8A6A8;      /* 紙上でなじむピンク */
    --tape-mint:rgba(164,197,175,.85);
    --tape-berry:rgba(226,122,148,.85);
    --hand:"Klee One","Hiragino Maru Gothic ProN","Yu Gothic",cursive;
    --gothic:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
    --obj-shadow:0 12px 28px rgba(64,56,47,.20);
    --dash:1.5px dashed rgba(64,56,47,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(rgba(64,56,47,.05) 1px, transparent 1px) 0 0/22px 22px,
      var(--desk);
    color:var(--pencil);
    font-family:var(--gothic);
    line-height:1.85;
    -webkit-text-size-adjust:100%;
    padding-bottom:110px;
  }
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;color:inherit}
  .shell{max-width:760px;margin:0 auto;padding:0 16px}
  :focus-visible{outline:2.5px solid var(--mint);outline-offset:3px}

  /* ---------- 共通ヘッダー(6選と同一) ---------- */
  .site-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:18px 0 4px;
  }
  .sticker{
    display:inline-block;
    background:var(--paper);
    padding:8px 16px 9px;
    transform:rotate(-2deg);
    box-shadow:var(--obj-shadow);
    position:relative;
    font-family:var(--hand);
    font-weight:600;
    font-size:16px;
    letter-spacing:.04em;
    white-space:nowrap;
  }
  .sticker::before{
    content:"";position:absolute;
    width:46px;height:15px;
    background:var(--tape-berry);
    top:-7px;left:-12px;
    transform:rotate(-12deg);
  }
  .sticker span{color:#e27a94}
  .site-head .here{font-size:12px;font-weight:700;letter-spacing:.14em;color:var(--faded)}

  .tool-nav{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:6px;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    max-width:760px;
    padding:6px 2px 10px;
  }
  .tool-nav::-webkit-scrollbar{display:none}
  .tool-nav a{
    flex:0 0 auto;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-height:38px;
    padding:8px 12px;
    background:rgba(255,255,255,.58);
    border:1px solid rgba(64,56,47,.16);
    box-shadow:0 4px 12px rgba(64,56,47,.08);
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    color:var(--faded);
    transform:rotate(.2deg);
  }
  .tool-nav a:nth-child(2n){transform:rotate(-.4deg)}
  .tool-nav a.active{
    color:var(--pencil);
    background:var(--paper);
    position:relative;
  }
  .tool-nav a.active::before{
    content:"";
    position:absolute;
    width:32px;
    height:8px;
    background:var(--tape-berry);
    top:-5px;
    left:50%;
    transform:translateX(-50%) rotate(-3deg);
  }
  @media(max-width:760px){
    .site-head{display:block}
    .site-head .sticker{margin-bottom:10px}
    .tool-nav{justify-content:flex-start;max-width:100%;padding-bottom:6px}
  }

  /* ---------- 見出し ---------- */
  .intro{padding:18px 0 10px}
  .intro h1{
    font-family:var(--hand);
    font-weight:600;
    font-size:clamp(28px,7.6vw,38px);
    letter-spacing:.06em;
    line-height:1.3;
    transform:rotate(-.6deg);
  }
  .intro h1 em{font-style:normal;border-bottom:3px solid var(--tape-berry)}
  .intro .lede{font-size:13px;color:var(--faded);margin-top:6px}

  /* ---------- コンタクトシート(編集画面=完成画像) ---------- */
  .sheet-wrap{
    position:relative;
    margin-top:14px;
    padding:14px 0 0;
  }
  .sheet-wrap::before,
  .sheet-wrap::after{
    content:"";
    position:absolute;
    z-index:8;
    width:72px;
    height:20px;
    background:var(--tape-berry);
    top:4px;
    opacity:.82;
    box-shadow:0 3px 8px rgba(64,56,47,.08);
  }
  .sheet-wrap::before{left:9%;transform:rotate(-6deg)}
  .sheet-wrap::after{right:9%;transform:rotate(5deg)}
  .sheet-wrap .tape-l,
  .sheet-wrap .tape-r{display:none}

  .sheet{
    position:relative;
    background:
      linear-gradient(rgba(64,56,47,.026) 1px, transparent 1px),
      linear-gradient(90deg, rgba(64,56,47,.026) 1px, transparent 1px),
      var(--sheet);
    background-size:18px 18px,18px 18px,auto;
    padding:4.2% 4.2% 0;
    border:1px solid rgba(64,56,47,.09);
    box-shadow:var(--obj-shadow);
    overflow:hidden;
  }
  .sheet::before{
    content:"";
    position:absolute;
    inset:10px;
    border:1px dashed rgba(64,56,47,.11);
    pointer-events:none;
  }
  .sheet::after{
    content:"BEST VISUAL CONTACT SHEET";
    position:absolute;
    right:18px;
    top:14px;
    font-size:9px;
    font-weight:700;
    letter-spacing:.16em;
    color:rgba(64,56,47,.22);
  }
  .sheet-grid{
    position:relative;
    z-index:1;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    column-gap:2.2%;
    row-gap:0;
  }
  .cell{
    display:flex;
    flex-direction:column;
    min-width:0;
  }
  .cell .shot{
    position:relative;
    display:block;
    width:100%;
    padding:6px;
    border:0;
    background:var(--paper);
    cursor:pointer;
    margin-block:auto;
    box-shadow:0 3px 10px rgba(64,56,47,.08);
  }
  .cell .shot::after{
    content:"";
    position:absolute;
    inset:6px;
    border:1px solid rgba(64,56,47,.07);
    pointer-events:none;
  }
  .cell .shot img{
    width:100%;
    aspect-ratio:3/4;
    object-fit:cover;
    object-position:center top;
  }
  .cell.group .shot img{aspect-ratio:16/9}
  .cell .shot .no{
    position:absolute;
    left:11px;
    top:9px;
    font-family:var(--hand);
    font-weight:600;
    font-size:clamp(9px,2.4vw,12px);
    color:var(--mint-bright);
    letter-spacing:.1em;
    text-shadow:0 1px 2px rgba(255,255,255,.7);
    pointer-events:none;
  }
  .cell .shot:active img{opacity:.85}
  .cell .name{
    font-size:clamp(8.5px,2.3vw,11px);
    font-weight:700;
    letter-spacing:.16em;
    color:var(--pencil);
    text-align:center;
    padding:8px 0 13px;
  }

  /* シート下端のキャプション(保存画像と同じ) */
  .sheet-caption{
    position:relative;
    z-index:1;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:10px;
    padding:5px 2px 15px;
    border-top:1px dashed rgba(64,56,47,.11);
  }
  .sheet-caption .title{
    font-family:var(--hand);
    font-weight:600;
    font-size:clamp(17px,4.6vw,24px);
    letter-spacing:.08em;
    color:var(--pencil);
    transform:rotate(-1.2deg);
  }
  .sheet-caption .meta{
    font-family:var(--hand);
    font-size:clamp(9px,2.4vw,12px);
    color:var(--sheet-soft);
    letter-spacing:.12em;
    white-space:nowrap;
  }

  .sheet-hint{
    margin-top:10px;
    font-family:var(--hand);
    font-size:13px;
    font-weight:600;
    color:var(--faded);
    text-align:center;
  }

  /* ---------- 下部ドック ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--paper);
    border-top:var(--dash);
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .dock-inner{
    max-width:760px;margin:0 auto;
    display:flex;align-items:center;gap:12px;
  }
  .chip-btn{
    min-height:52px;
    padding:10px 16px;
    font-family:var(--hand);
    font-weight:600;font-size:14px;
    background:transparent;
    border:1.5px solid var(--pencil);
    border-radius:50%;          /* 手描きの丸囲み */
    cursor:pointer;
    transform:rotate(-2deg);
    white-space:nowrap;
  }
  .chip-btn:active{background:var(--pencil);color:var(--desk)}
  .save-btn{
    flex:1;
    min-height:52px;
    background:var(--pencil);
    color:var(--desk);
    border:0;
    font-size:15px;font-weight:700;letter-spacing:.04em;
    cursor:pointer;
  }
  .save-btn:disabled{opacity:.55;cursor:default}
  .status{
    max-width:760px;margin:6px auto 0;
    min-height:1.3em;
    font-family:var(--hand);
    font-size:12px;font-weight:600;
    color:#c0472f;
    text-align:center;
  }
  .status.ok{color:var(--pencil)}

  /* ---------- フッター(メモ) ---------- */
  .back-desk{
    display:flex;align-items:center;justify-content:center;gap:8px;
    margin:36px auto 10px;
    font-family:var(--hand);
    font-weight:600;font-size:15px;
    width:fit-content;
    padding:10px 6px;
  }
  .back-desk svg{width:34px;height:18px;stroke:var(--pencil);fill:none;stroke-width:1.8;stroke-linecap:round}
  .memo{
    margin:0 auto 26px;
    max-width:520px;
    background:var(--paper);
    padding:18px 20px 20px;
    transform:rotate(.8deg);
    box-shadow:var(--obj-shadow);
    position:relative;
    font-size:12px;line-height:2;
  }
  .memo::before{
    content:"";position:absolute;
    width:64px;height:18px;
    background:var(--tape-berry);
    top:-9px;left:50%;
    transform:translateX(-50%) rotate(-2deg);
  }
  .memo small{display:block;color:var(--faded);margin-top:6px}

  /* ---------- 候補モーダル(6選と同じ作法) ---------- */
  .modal{
    position:fixed;inset:0;z-index:100;
    background:rgba(64,56,47,.32);
    display:none;align-items:flex-end;justify-content:center;
  }
  .modal.active{display:flex}
  .modal-inner{
    width:100%;max-width:760px;
    max-height:86vh;overflow:auto;
    -webkit-overflow-scrolling:touch;
    background:var(--paper);
    padding:18px 16px calc(24px + env(safe-area-inset-bottom));
    box-shadow:0 -12px 30px rgba(43,39,35,.3);
  }
  .modal-header{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding-bottom:12px;margin-bottom:14px;
    border-bottom:var(--dash);
  }
  .modal-title{font-family:var(--hand);font-weight:600;font-size:19px;letter-spacing:.04em}
  .close-button{
    width:44px;height:44px;
    border:1.5px solid var(--pencil);
    border-radius:50%;
    background:transparent;
    font-size:18px;font-weight:700;
    cursor:pointer;
    transform:rotate(3deg);
  }
  .photo-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
  }
  @media(max-width:520px){.photo-grid{grid-template-columns:repeat(3,1fr)}}
  .photo-option{
    position:relative;padding:3px;border:0;
    background:var(--paper);
    box-shadow:0 4px 12px rgba(64,56,47,.14);
    cursor:pointer;
  }
  .photo-option img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top}
  .photo-option.wide img{aspect-ratio:16/9}
  .photo-option.is-selected{outline:3px solid var(--mint);outline-offset:2px}
  .photo-option.is-selected::after{
    content:"✓";position:absolute;right:4px;top:4px;
    width:20px;height:20px;display:grid;place-items:center;
    background:var(--mint);color:#fff;
    font-size:12px;font-weight:700;border-radius:50%;
  }

  /* ---------- モーション ---------- */
  @media(prefers-reduced-motion:no-preference){
    .settle{opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s ease}
    .settle.in{opacity:1;transform:none}
  }
  </style>
</head>

  <header class="site-head">

<div class="dock" role="region" aria-label="操作">
  <div class="dock-inner">
    <button id="randomBtn" class="chip-btn" type="button">ランダム</button>
    <button id="saveBtn" class="save-btn" type="button">画像保存</button>

  <div id="status" class="status" aria-live="polite"></div>

<div id="picker" class="modal" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="modal-inner">
    <div class="modal-header">
      <div id="pickerTitle" class="modal-title">画像を選んでください</div>

<script>
/* =====================================================================
   ロジック — 機能は現行版と同一(9コマ×候補15枚/初期01/ランダム/保存)。
   変更点: html2canvasを撤去しCanvas直描きに(iOSでのscale:5無音失敗を根絶)、
   PCは確実にダウンロード、共有キャンセルをエラー扱いしない、
   ピッカーにESC・背景タップ・選択中マーク・遅延読み込みを追加。
   ===================================================================== */
(function () {
"use strict";

/* ---------- データ：パフォーマンス衣装編も images/メンバー/01.png〜15.png を読む ---------- */
var cells = [
  { member: "kairyu", name: "KAIRYU" },
  { member: "naoya",  name: "NAOYA" },
  { member: "ran",    name: "RAN" },
  { member: "seito",  name: "SEITO" },
  { member: "group",  name: "MAZZEL" },
  { member: "ryuki",  name: "RYUKI" },
  { member: "takuto", name: "TAKUTO" },
  { member: "hayato", name: "HAYATO" },
  { member: "eiki",   name: "EIKI" }
];
var imageCounts = {
  // 新しいアー写は各フォルダの15.pngに上書きすると、候補一覧の一番左上に表示されます。
  kairyu: 15, naoya: 15, ran: 15, seito: 15, group: 15,
  ryuki: 15, takuto: 15, hayato: 15, eiki: 15
};

/* ---------- 状態 ---------- */
var selection = cells.map(function(){ return 1; }); // 各コマの選択番号(初期は01)
var currentCellIndex = null;
var lastFocused = null;

/* ---------- 要素 ---------- */
var sheetGrid = document.getElementById("sheetGrid");
var picker = document.getElementById("picker");
var pickerTitle = document.getElementById("pickerTitle");
var options = document.getElementById("options");
var closeButton = picker.querySelector(".close-button");
var randomBtn = document.getElementById("randomBtn");
var saveBtn = document.getElementById("saveBtn");
var statusEl = document.getElementById("status");

init();

function init() {
  document.getElementById("sheetDate").textContent = formatDate(new Date());
  renderSheet();
  randomBtn.addEventListener("click", randomize);
  saveBtn.addEventListener("click", saveImage);
  closeButton.addEventListener("click", closePicker);
  picker.addEventListener("click", function (e) {
    if (e.target === picker) closePicker();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && picker.classList.contains("active")) closePicker();
  });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
      });
    }, { threshold: .05 });
    document.querySelectorAll(".settle").forEach(function (el) { io.observe(el); });
  } else {
    document.querySelectorAll(".settle").forEach(function (el) { el.classList.add("in"); });
  }
}

function fileName(num) { return String(num).padStart(2, "0") + ".png"; }
function srcFor(index) { return "images/" + cells[index].member + "/" + fileName(selection[index]); }
function formatDate(d) {
  return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0");
}

/* ---------- シート描画(コマ全面がタップ範囲) ---------- */
function renderSheet() {
  sheetGrid.innerHTML = "";
  cells.forEach(function (cell, index) {
    var wrap = document.createElement("div");
    wrap.className = "cell" + (cell.member === "group" ? " group" : "");

    var shot = document.createElement("button");
    shot.type = "button";
    shot.className = "shot";
    shot.setAttribute("aria-label", (index + 1) + "コマ目 " + cell.name + " の写真を変える");

    var img = document.createElement("img");
    img.src = srcFor(index);
    img.alt = cell.name;

    var no = document.createElement("span");
    no.className = "no";
    no.textContent = String(index + 1).padStart(2, "0");

    shot.appendChild(img);
    shot.appendChild(no);
    shot.addEventListener("click", function(){ openPicker(index); });

    var name = document.createElement("div");
    name.className = "name";
    name.textContent = cell.name;

    wrap.appendChild(shot);
    wrap.appendChild(name);
    sheetGrid.appendChild(wrap);
  });
}

function updateCellImage(index) {
  var img = sheetGrid.children[index] && sheetGrid.children[index].querySelector("img");
  if (img) img.src = srcFor(index);
}

/* ---------- ピッカー ---------- */
function openPicker(index) {
  currentCellIndex = index;
  lastFocused = document.activeElement;
  pickerTitle.textContent = cells[index].name + " の画像を選ぶ";
  options.innerHTML = "";

  var member = cells[index].member;
  var count = imageCounts[member] || 0;
  // 新しいアー写は既存の15.pngに上書きしてください。
  // 候補一覧では15番を先頭に出し、その後に01〜14を並べます。
  var order = [];
  if (count >= 15) order.push(15);
  for (var i = 1; i <= count; i++) {
    if (i !== 15) order.push(i);
  }
  order.forEach(function (num) {
    (function (num) {
      var button = document.createElement("button");
      button.type = "button";
      button.className = "photo-option" + (member === "group" ? " wide" : "");
      var img = document.createElement("img");
      img.src = "images/" + member + "/" + fileName(num);
      img.alt = cells[index].name + " " + num;
      img.loading = "lazy";
      img.onerror = function(){ button.style.display = "none"; };
      if (num === selection[index]) button.classList.add("is-selected");
      button.appendChild(img);
      button.addEventListener("click", function () {
        selection[currentCellIndex] = num;
        updateCellImage(currentCellIndex);
        closePicker();
      });
      options.appendChild(button);
    })(num);
  });
  picker.classList.add("active");
  closeButton.focus();
}
function closePicker() {
  picker.classList.remove("active");
  options.innerHTML = "";
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

/* ---------- ランダム ---------- */
function randomize() {
  cells.forEach(function (cell, index) {
    var count = imageCounts[cell.member] || 1;
    selection[index] = Math.floor(Math.random() * count) + 1;
    updateCellImage(index);
  });
  setStatus("ランダムに並べました。", true);
}

/* ---------- Canvas 直描き(プレビューと同じベタ焼きを描く) ---------- */
function loadCanvasImage(src) {
  return new Promise(function (resolve) {
    var image = new Image();
    image.onload = function(){ resolve(image); };
    image.onerror = function(){ resolve(null); };
    image.src = src;
  });
}
function canvasToBlob(canvas) {
  return new Promise(function (resolve, reject) {
    canvas.toBlob(function (blob) {
      if (blob) resolve(blob); else reject(new Error("Blob creation failed"));
    }, "image/png");
  });
}
function drawCoverTop(ctx, img, x, y, w, h) {
  if (!img) {
    ctx.fillStyle = "#cbc1b4";
    ctx.fillRect(x, y, w, h);
    return;
  }
  var s = Math.max(w / img.naturalWidth, h / img.naturalHeight);
  var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
  var dx = x + (w - dw) / 2;   // 左右センター
  var dy = y;                  // 上寄せ(プレビューのobject-position:center topと同じ)
  ctx.save();
  ctx.beginPath();
  ctx.rect(x, y, w, h);
  ctx.clip();
  ctx.drawImage(img, dx, dy, dw, dh);
  ctx.restore();
}

var UI_FONT = "system-ui, -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif";
var HAND_FONT = "'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif";

async function createSheetCanvas() {
  // レイアウト定数(1200幅・面積はiOS上限の約1/8で安全)
  var W = 1200, P = 40, G = 14, LABEL = 34, FOOTER = 76;
  var cw = (W - P * 2 - G * 2) / 3;          // コマ幅 364
  var ch = cw * 4 / 3;                        // 縦コマ高 485.3
  var gh = cw * 9 / 16;                       // 横長コマ高 204.75
  var rowPitch = ch + LABEL + G;
  var H = Math.round(P + rowPitch * 3 - G + FOOTER + P);

  var canvas = document.createElement("canvas");
  canvas.width = W;
  canvas.height = H;
  var ctx = canvas.getContext("2d");

  try { await document.fonts.load("600 40px 'Klee One'"); } catch (e) {}

  // ピンクベージュのコンタクトシート背景
  ctx.fillStyle = "#F4E8E2";
  ctx.fillRect(0, 0, W, H);

  // うっすら方眼
  ctx.save();
  ctx.strokeStyle = "rgba(64,56,47,.030)";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= W; gx += 18) {
    ctx.beginPath();
    ctx.moveTo(gx, 0);
    ctx.lineTo(gx, H);
    ctx.stroke();
  }
  for (var gy = 0; gy <= H; gy += 18) {
    ctx.beginPath();
    ctx.moveTo(0, gy);
    ctx.lineTo(W, gy);
    ctx.stroke();
  }
  ctx.restore();

  // 外枠と点線の内枠
  ctx.save();
  ctx.strokeStyle = "rgba(64,56,47,.07)";
  ctx.lineWidth = 2;
  ctx.strokeRect(8, 8, W - 16, H - 16);
  ctx.setLineDash([7, 7]);
  ctx.strokeStyle = "rgba(64,56,47,.12)";
  ctx.strokeRect(20, 20, W - 40, H - 40);
  ctx.restore();

  // 小さな印字
  ctx.save();
  ctx.fillStyle = "rgba(64,56,47,.24)";
  ctx.font = "700 16px " + UI_FONT;
  ctx.textAlign = "right";
  ctx.textBaseline = "top";
  ctx.fillText("BEST VISUAL CONTACT SHEET", W - 34, 26);
  ctx.restore();

  var images = await Promise.all(cells.map(function (c, i) { return loadCanvasImage(srcFor(i)); }));

  cells.forEach(function (cell, index) {
    var col = index % 3, row = Math.floor(index / 3);
    var x = P + col * (cw + G);
    var zoneY = P + row * rowPitch;
    var isGroup = cell.member === "group";
    var h = isGroup ? gh : ch;
    var y = isGroup ? zoneY + (ch - gh) / 2 : zoneY;  // 横長は行内センター(プレビューと同じ)

    // 白フチのプリント写真
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(64,56,47,.08)";
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;
    ctx.fillRect(x, y, cw, h);
    ctx.restore();

    var pad = 8;
    drawCoverTop(ctx, images[index], x + pad, y + pad, cw - pad * 2, h - pad * 2);

    ctx.save();
    ctx.strokeStyle = "rgba(64,56,47,.07)";
    ctx.lineWidth = 1;
    ctx.strokeRect(x + pad, y + pad, cw - pad * 2, h - pad * 2);
    ctx.restore();

    // コマ番号(ミント)
    ctx.save();
    ctx.font = "600 22px " + HAND_FONT;
    ctx.fillStyle = "#D8A6A8";
    ctx.textBaseline = "top";
    ctx.shadowColor = "rgba(255,255,255,.70)";
    ctx.shadowBlur = 2;
    ctx.shadowOffsetY = 1;
    ctx.fillText(String(index + 1).padStart(2, "0"), x + 14, y + 12);
    ctx.restore();

    // 名前(コマ下の紙上)
    ctx.save();
    ctx.font = "700 19px " + UI_FONT;
    ctx.fillStyle = "#40382f";
    ctx.textAlign = "center";
    ctx.textBaseline = "top";
    // letter-spacingの簡易再現
    var name = cell.name.split("").join("\u2009");
    ctx.fillText(name, x + cw / 2, zoneY + ch + 9);
    ctx.restore();
  });

  // 下端キャプション(プレビューと同じ)
  var footTop = P + rowPitch * 3 - G + 14;
  ctx.save();
  ctx.translate(P + 6, footTop + 22);
  ctx.rotate(-1.2 * Math.PI / 180);
  ctx.font = "600 40px " + HAND_FONT;
  ctx.fillStyle = "#40382f";
  ctx.textBaseline = "middle";
  ctx.fillText("MY BEST 9", 0, 0);
  ctx.restore();

  ctx.save();
  ctx.font = "400 19px " + HAND_FONT;
  ctx.fillStyle = "rgba(64,56,47,.58)";
  ctx.textAlign = "right";
  ctx.textBaseline = "middle";
  ctx.fillText("MAZZEL PERFORMANCE COSTUME — " + formatDate(new Date()), W - P - 4, footTop + 24);
  ctx.restore();

  return canvas;
}

/* ---------- 保存(共有シート→ダウンロード→スクショ案内) ---------- */
async function saveImage() {
  var originalText = saveBtn.textContent;
  saveBtn.disabled = true;
  saveBtn.textContent = "画像を作成中…";
  setStatus("画像を作成中…", true);

  try {
    var canvas = await createSheetCanvas();
    var blob = await canvasToBlob(canvas);
    var file = new File([blob], "mazzel-best-visual-9-performance.png", { type: "image/png" });

    if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          files: [file],
          title: "MAZZEL Best Visual 9 - Performance Costume",
          text: "MAZZEL Best Visual 9 パフォ衣装編を作ったよ"
        });
        setStatus("共有シートを開きました。", true);
        return;
      } catch (shareError) {
        if (shareError && shareError.name === "AbortError") {
          setStatus("共有をキャンセルしました。", true);
          return;
        }
      }
    }

    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "mazzel-best-visual-9-performance.png";
    document.body.appendChild(a);
    a.click();
    a.remove();
    window.setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    setStatus("画像を保存しました。", true);
  } catch (error) {
    console.error(error);
    setStatus("画像の保存に失敗しました。うまくいかない場合はシートをスクリーンショットしてください。");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = originalText;
  }
}

function setStatus(message, ok) {
  statusEl.textContent = message || "";
  statusEl.classList.toggle("ok", !!ok);
  if (!message) return;
  window.clearTimeout(setStatus.timer);
  setStatus.timer = window.setTimeout(function(){ statusEl.textContent = ""; }, 3500);
}

})();
</script>
